name: Update CRoaring

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.CROARING_UPDATE_TOKEN }}

    - name: Check for new CRoaring release
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        latest=$(gh api repos/RoaringBitmap/CRoaring/releases/latest --jq '.tag_name' | sed 's/^v//')
        current=$(sed -n -E 's/^version = "(.*)"/\1/p' croaring-sys/Cargo.toml)
        echo "Latest CRoaring: $latest, current croaring-sys: $current"
        newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
        if [ -n "$latest" ] && [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
          echo "version=$latest" >> "$GITHUB_OUTPUT"
        fi

    - uses: dtolnay/rust-toolchain@stable
      if: steps.check.outputs.version

    - name: Install bindgen
      if: steps.check.outputs.version
      uses: taiki-e/install-action@v2
      with:
        tool: bindgen-cli

    - name: Update CRoaring
      if: steps.check.outputs.version
      run: make update_croaring version=${{ steps.check.outputs.version }}

    - name: Create pull request
      if: steps.check.outputs.version
      env:
        GH_TOKEN: ${{ secrets.CROARING_UPDATE_TOKEN }}
        VERSION: ${{ steps.check.outputs.version }}
      run: |
        branch=update-croaring
        title="chore: update to croaring-sys $VERSION"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -C "$branch"
        git add -A
        git commit -m "$title"
        git push --force origin "$branch"
        if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
          gh pr create --head "$branch" --title "$title" \
            --body "Updates vendored CRoaring to [v$VERSION](https://github.com/RoaringBitmap/CRoaring/releases/tag/v$VERSION)."
        else
          gh pr edit "$branch" --title "$title"
        fi
